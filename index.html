<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaboGo - Google Play Store</title>
    
    <!-- Meta refresh: Oddiy brauzerlar uchun avto-yo'naltirish -->
    <meta http-equiv="refresh" content="1;url=https://play.google.com/store/apps/details?id=bor.nasiya.nasiyabor">
    
    <!-- Open Graph (Instagram, Facebook va Telegram prevyu va botlar uchun) -->
    <meta property="og:title" content="LaboGo - Ilovani yuklab olish">
    <meta property="og:description" content="LaboGo rasmiy mobil ilovasini Google Play Store orqali bepul yuklab oling.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://play.google.com/store/apps/details?id=bor.nasiya.nasiyabor">
    <meta property="og:image" content="https://lh3.googleusercontent.com/d/1_LaboGo_App_Icon">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        body {
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            border-radius: 24px;
            padding: 32px 24px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            max-width: 380px;
            width: 100%;
        }
        .app-icon {
            width: 88px;
            height: 88px;
            background: linear-gradient(135deg, #01875f, #005c40);
            border-radius: 20px;
            margin: 0 auto 16px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-size: 36px;
            font-weight: bold;
            box-shadow: 0 6px 16px rgba(1, 135, 95, 0.3);
        }
        h1 {
            font-size: 22px;
            color: #202124;
            margin-bottom: 6px;
            font-weight: 700;
        }
        .developer {
            font-size: 13px;
            color: #01875f;
            font-weight: 600;
            margin-bottom: 16px;
        }
        .description {
            font-size: 14px;
            color: #5f6368;
            line-height: 1.5;
            margin-bottom: 24px;
        }
        .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid #e8eaed;
            border-top: 3px solid #01875f;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: #01875f;
            color: #ffffff;
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            box-shadow: 0 4px 12px rgba(1, 135, 95, 0.25);
            transition: all 0.2s ease;
        }
        .btn:active {
            transform: scale(0.98);
            background-color: #016c4c;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="app-icon">L</div>
        <h1>LaboGo</h1>
        <div class="developer">Google Play Store</div>
        
        <div class="spinner"></div>
        <p class="description">Google Play Store'ga yo'naltirilmoqda...</p>

        <a id="playStoreBtn" class="btn" href="https://play.google.com/store/apps/details?id=bor.nasiya.nasiyabor">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M3,20.5V3.5C3,2.91 3.34,2.39 3.84,2.15L13.69,12L3.84,21.85C3.34,21.6 3,21.09 3,20.5M16.81,15.12L6.05,21.34L14.54,12.85L16.81,15.12M20.16,10.81C20.5,11.08 20.75,11.5 20.75,12C20.75,12.5 20.5,12.92 20.16,13.19L17.89,14.5L15.39,12L17.89,9.5L20.16,10.81M6.05,2.66L16.81,8.88L14.54,11.15L6.05,2.66Z"/>
            </svg>
            Play Store'da ochish
        </a>
    </div>

    <script>
        (function() {
            var targetUrl = "https://play.google.com/store/apps/details?id=bor.nasiya.nasiyabor";
            var marketAppUrl = "market://details?id=bor.nasiya.nasiyabor";

            // Botlarni aniqlash (Instagram botlari bloklamasligi uchun)
            var ua = navigator.userAgent.toLowerCase();
            var isBot = /facebookexternalhit|facebot|googlebot|bingbot|crawler|spider|robot/i.test(ua);

            if (!isBot) {
                // Haqiqiy odam kirganda darhol Android Play Store ilovasida yoki brauzerda ochish
                setTimeout(function() {
                    window.location.href = marketAppUrl;
                    setTimeout(function() {
                        window.location.replace(targetUrl);
                    }, 300);
                }, 100);
            }
        })();
    </script>
</body>
</html>
