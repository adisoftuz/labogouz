<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaboGo - Mobil ilovasini yuklab olish</title>
    
    <!-- Open Graph (Instagram va Meta uchun) -->
    <meta property="og:title" content="LaboGo - Yuk tashish va transport xizmati">
    <meta property="og:description" content="LaboGo rasmiy mobil ilovasini Google Play Store orqali yuklab oling.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://adisoftuz.github.io/labogouz/">
    <meta property="og:image" content="https://play-lh.googleusercontent.com/328636928_PlayStore_Icon">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #f4f6f8;
            color: #202124;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        .container {
            background: #ffffff;
            border-radius: 28px;
            padding: 32px 24px;
            text-align: center;
            box-shadow: 0 12px 32px rgba(0,0,0,0.06);
            max-width: 400px;
            width: 100%;
        }
        .app-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }
        .app-icon {
            width: 96px;
            height: 96px;
            background: linear-gradient(135deg, #01875f, #005c40);
            border-radius: 22px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-size: 40px;
            font-weight: 800;
            box-shadow: 0 8px 20px rgba(1, 135, 95, 0.25);
            margin-bottom: 16px;
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 4px;
        }
        .subtitle {
            font-size: 14px;
            color: #01875f;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .badges {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
        }
        .badge {
            background: #f1f3f4;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            color: #5f6368;
            font-weight: 500;
        }
        .features {
            text-align: left;
            background: #f8f9fa;
            border-radius: 16px;
            padding: 16px 20px;
            margin-bottom: 24px;
        }
        .feature-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: #3c4043;
            margin-bottom: 10px;
        }
        .feature-item:last-child {
            margin-bottom: 0;
        }
        .feature-item svg {
            color: #01875f;
            flex-shrink: 0;
        }
        .download-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: #01875f;
            color: #ffffff;
            text-decoration: none;
            padding: 16px 24px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 16px;
            box-shadow: 0 6px 18px rgba(1, 135, 95, 0.3);
            transition: all 0.2s ease;
        }
        .download-btn:active {
            transform: scale(0.98);
            background-color: #016c4c;
        }
        .footer-text {
            margin-top: 16px;
            font-size: 12px;
            color: #80868b;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="app-header">
            <div class="app-icon">L</div>
            <h1>LaboGo</h1>
            <div class="subtitle">Yuk tashish va transport xizmati</div>
        </div>

        <div class="badges">
            <span class="badge">⭐ 4.8 Reyting</span>
            <span class="badge">FREE Bepul</span>
            <span class="badge">Android</span>
        </div>

        <div class="features">
            <div class="feature-item">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                </svg>
                Tezkor va qulay transport buyurtmasi
            </div>
            <div class="feature-item">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                </svg>
                Haqiqiy vaqt rejimida haydovchini kuzatish
            </div>
            <div class="feature-item">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                </svg>
                Hamyonbop narxlar va ishonchli xizmat
            </div>
        </div>

        <a class="download-btn" href="https://play.google.com/store/apps/details?id=bor.nasiya.nasiyabor">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                <path d="M3,20.5V3.5C3,2.91 3.34,2.39 3.84,2.15L13.69,12L3.84,21.85C3.34,21.6 3,21.09 3,20.5M16.81,15.12L6.05,21.34L14.54,12.85L16.81,15.12M20.16,10.81C20.5,11.08 20.75,11.5 20.75,12C20.75,12.5 20.5,12.92 20.16,13.19L17.89,14.5L15.39,12L17.89,9.5L20.16,10.81M6.05,2.66L16.81,8.88L14.54,11.15L6.05,2.66Z"/>
            </svg>
            Google Play'dan Yuklab Olish
        </a>

        <div class="footer-text">
            Rasmiy ilovani yuklab olish uchun Google Play Store'ga o'ting.
        </div>
    </div>

</body>
</html>
